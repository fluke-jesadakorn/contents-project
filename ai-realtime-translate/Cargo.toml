[package]
name = "foundry"
version = "0.1.0"
edition = "2021"
description = "Foundry — Realtime Voice Intelligence (macOS native, Dioxus)"
authors = ["The Factory Group"]
license = "MIT"

[dependencies]
# ─── Dioxus core + desktop runtime (macOS-only) ───
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = { version = "0.7" }

# ─── Async runtime ───
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-channel = "2"

# ─── Audio capture (CoreAudio on macOS via cpal) ───
cpal = "0.15"
hound = "3.5"

# ─── HTTP (HuggingFace model listing) ───
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ─── ObjC bindings for ScreenCaptureKit (macOS 13+ system audio capture) ───
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSObject"] }
block2 = "0.6"

# ─── Misc ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Numerics + signal processing ───
# rustfft for denoise (spectral gating) — pure Rust, no Python dep
rustfft = "6"
num-complex = "0.4"

# ─── Misc ───
anyhow = "1"
thiserror = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = "0.4"
base64 = "0.22"
parking_lot = "0.12"
once_cell = "1"

[features]
default = []
mlx-bridge = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1